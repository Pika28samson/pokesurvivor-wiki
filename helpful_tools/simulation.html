<header class="site-header"><nav class="nav" aria-label="Main navigation"><a href="index.html"><img class="wiki-logo" src="icons/icon-192.png" alt="" width="28" height="28">PokéSurvivor Wiki</a><details class="nav-group"><summary>Reference</summary><div class="nav-menu"><a href="pokemon.html">Pokémon</a><a href="moves.html">Moves</a><a href="abilities.html">Abilities</a><a href="items.html">Items &amp; orbs</a></div></details><details class="nav-group"><summary>Tools</summary><div class="nav-menu"><a href="tm-finder.html">TM finder</a><a href="gacha.html">Gacha calculation</a><a href="simulation.html">Build simulation</a></div></details><details class="nav-group"><summary>Mechanics</summary><div class="nav-menu"><a href="mechanics.html">Game mechanics</a><a href="mechanics.html#pokemon-tiers">Ranking rules</a><a href="wiki.html">Wiki overview</a></div></details></nav><form class="global-search" action="search.html" role="search"><label for="global-query">Search the wiki</label><div class="global-search-row"><input id="global-query" name="q" type="search" autocomplete="off" placeholder="Pokémon, moves, abilities, mechanics…" aria-controls="global-results"><button type="submit">Search</button></div><div id="global-results" class="global-results" aria-label="Search suggestions" hidden></div></form></header>
<main><h1>Simulation</h1>
<p id="sim-storage-message" class="notice" role="status" hidden></p>
<details class="panel" id="sim-editor" open><summary id="sim-editor-title">Create a build</summary>
<form id="sim-build-form"><div class="filters"><label>Build name<input id="sim-name" maxlength="80" required placeholder="e.g. Mewtwo special build"></label><label>Find Pokémon<input id="sim-pokemon-search" type="search" placeholder="Name or dex number"></label><label>Pokémon<select id="sim-pokemon" required></select></label><label>Ability<select id="sim-ability"></select></label></div>
<div id="sim-portrait" class="sim-mon-info"></div><div class="sim-move-toolbar"><label>Find moves<input id="sim-move-search" type="search" placeholder="Name, type or family"></label><label>Type<select id="sim-move-type"><option value="">All types</option></select></label><span id="sim-move-count" role="status"></span></div><div id="sim-picked" class="move-links"></div><div id="sim-move-options" class="sim-move-options"></div>
<p id="sim-form-error" class="error" role="alert"></p><div class="sim-actions"><button id="sim-save" type="submit">Save build</button><button id="sim-cancel-edit" class="secondary" type="button" hidden>Cancel edit</button></div></form></details>
<details class="panel"><summary>Canvas Settings</summary><form id="sim-settings" class="filters">
<label>Preview mode<select id="sim-mode"><option value="swarm">Moving enemy swarm</option><option value="stationary">Stationary targets</option></select></label>
<label>Enemy HP<input id="sim-enemyHp" type="number" min="1" max="1000000" value="800"></label><label>Spawns per second<input id="sim-spawnRate" type="number" min="0.1" max="100" step="0.1" value="20"></label><label>Max enemies<input id="sim-maxEnemies" type="number" min="1" max="200" value="30"></label><label>Enemy layers<input id="sim-layers" type="number" min="1" max="6" value="1"></label><label>Enemies per layer<input id="sim-perLayer" type="number" min="1" max="24" value="8"></label><label>Enemy arc (degrees)<input id="sim-arc" type="number" min="1" max="360" value="360"></label><label>Enemy distance (px)<input id="sim-distance" type="number" min="25" max="400" value="100"></label><label>Random seed<input id="sim-seed" type="number" min="0" max="4294967295" value="42"></label><label>Weather<select id="sim-weather"><option value="auto">Clear (no ability-summoned weather)</option><option value="none">Clear</option><option value="sun">Sun</option><option value="rain">Rain</option><option value="sand">Sand</option><option value="snow">Snow</option><option value="fog">Fog</option></select></label><label>Elapsed run seconds<input id="sim-elapsed" type="number" min="0" max="100000" value="1200"></label><label>Kills for ability scaling<input id="sim-kills" type="number" min="0" max="1000000" value="1000"></label><label>Player HP %<input id="sim-hpPercent" type="number" min="1" max="100" value="100"></label><button type="button" class="secondary" id="sim-reset-settings">Reset to defaults</button></form>
</details>
<details id="sim-saved-section" class="panel" open><summary id="sim-saved-title">Saved builds</summary><div class="sim-section-heading"><div class="sim-actions"><button class="secondary" id="sim-export" type="button">Export builds</button><label class="sim-import">Import builds<input id="sim-import" type="file" accept="application/json,.json"></label></div></div><div id="sim-saved"></div></details>
<section aria-labelledby="sim-compare-title"><div class="sim-section-heading"><h2 id="sim-compare-title">Compare builds</h2><button id="sim-restart" type="button" class="secondary">Restart comparisons</button></div><div id="sim-comparisons" class="sim-comparisons"></div></section></main>
